<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-img src="assets/jnv_logo.png" alt="Logo"></ion-img>
    </ion-buttons>

    <ion-title>
      <ion-text color="danger">
        <h1 class="app-text" style="font-family: 'Pacifico', cursive; font-size: 1.4rem;">JNV Kokrajhar Projects</h1>
      </ion-text>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="toggleTheme()">
        <ion-icon slot="icon-only" [name]="getThemeIcon()"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
